# ============================================================
# docs-seeker - 生产环境部署（服务器拉镜像版，内置 Redis Stack）
#
# 使用：
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f docs-seeker
#
# 本文件内置 Redis Stack（语义缓存/热门问题统计必需，含 RediSearch + RedisJSON），
# 无需外部 Redis；docs-seeker 容器内通过服务名 redis:6379 访问。
# 若服务器上已有 deploy 大栈在跑（其 redis 容器名同为 datapolit-redis），
# 两者互斥，请二选一，不要同时 up。
#
# 前置：服务器 /opt/datapolit-docs-seeker 下必须存在 .env（密钥不进仓库，
# 首次部署手动放置），关键字段：
#   DASHSCOPE_API_KEY           （百炼 Embedding）
#   DEEPSEEK_API_KEY            （DeepSeek 对话 LLM）
#   MILVUS_URI / MILVUS_TOKEN   （Zilliz Cloud endpoint / token）
#   SEMANTIC_CACHE_ENABLED      （可选，默认 true）
#   REDIS_URL                   （可选，会被本 compose 覆盖为 redis://redis:6379/0）
# ============================================================

services:
  docs-seeker:
    # 与 .cnb.yml 构建/推送的镜像名完全对齐；若服务器端未注入 CNB 环境变量，
    # 回退到与仓库路径一致的默认值 docker.cnb.cool/<your-username>/datapolit-doc-seeker:latest
    # 注意：镜像名跟随 CNB 远程仓库 slug（datapolit-doc-seeker，该仓库名本身少一个 s）；
    # 而服务名/容器名/启动命令必须是 docs-seeker / docs_seeker（Python 包名），两者不要混淆
    image: ${CNB_DOCKER_REGISTRY:-docker.cnb.cool}/${CNB_REPO_SLUG_LOWERCASE:-sra_lei/datapolit-doc-seeker}:latest
    # 容器名固定为 datapolit-docs-seeker：client/nginx.conf 反代目标（datapolit-shared 网络内）依赖该名字
    container_name: datapolit-docs-seeker
    command: uvicorn docs_seeker.api.main:app --host 0.0.0.0 --port 8001 --workers 1
    restart: unless-stopped

    ports:
      - "8001:8001"

    # 敏感配置全部从 .env 注入，不要在此文件内硬编码
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # 生产环境：关闭 /docs、/redoc、/openapi.json
      ENVIRONMENT: "production"
      # 容器内通过服务名 redis 访问内置的 Redis Stack（覆盖 .env 里的值）
      REDIS_URL: "redis://redis:6379/0"

    depends_on:
      redis:
        condition: service_healthy

    # 健康检查：直接调本机 /v1/health，不依赖 curl（slim 没装）
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8001/v1/health', timeout=5); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 资源上限（低配服务器：1C / 1G，无本地模型推理）
    # 若发现 OOM 或 504 Gateway Timeout：
    #   ① limits.memory 先加至 1.25g；
    #   ② 或降低外呼并发（当前是顺序 pipeline，通常 1G 足够）。
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

    # 安全加固：只读根文件系统 + tmpfs 写临时文件（jieba 分词缓存等）
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - datapolit-shared

  # ----------------------------------------------------------
  # Redis Stack：语义缓存（RediSearch ft() + RedisJSON json() 必需模块，
  # 普通 redis 镜像没有，语义缓存会初始化失败降级）
  # 不映射宿主机端口，仅容器内通过服务名 redis:6379 访问
  # ----------------------------------------------------------
  redis:
    image: redis/redis-stack-server:latest
    container_name: datapolit-redis
    environment:
      # 镜像入口是 redis-stack-server，额外参数通过 REDIS_ARGS 传入
      REDIS_ARGS: "--maxmemory 128mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis_data:/data
    networks:
      - datapolit-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  datapolit-shared:
    external: true
