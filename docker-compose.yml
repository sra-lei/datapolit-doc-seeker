services:
  docs-seeker:
    build: .
    container_name: docs-seeker
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    command: uvicorn docs_seeker.app:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/v1/health', timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
