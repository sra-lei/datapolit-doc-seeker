# docs-seeker 独立编排（本地开发：源码挂载 + 热重载）
# 统一走 datapolit-shared 共享网络，容器名与 deploy 生产编排保持一致
services:
  docs-seeker:
    build: .
    container_name: datapolit-docs-seeker
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # 共享网络内按容器名访问 redis（.env 的 localhost 仅供宿主机直跑 uvicorn 用）
      REDIS_URL: redis://datapolit-redis:6379/0
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn docs_seeker.api.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - datapolit-shared
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/v1/health', timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Redis Stack（RediSearch + RedisJSON）：语义缓存/热门问题统计必需
  # 注意：普通 redis 镜像缺少 ft()/json() 模块，语义缓存会初始化失败降级
  redis:
    image: redis/redis-stack-server:latest
    container_name: datapolit-redis
    # 宿主机映射 6380（本机 6379 已有旧 redis-server 占用，避免冲突）；仅调试用
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - datapolit-shared
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  datapolit-shared:
    external: true
