[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-seeker"
version = "0.1.0"
description = "在线检索与问答微服务（语义/稀疏/摘要三路融合检索 + LLM 答案生成）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymilvus>=2.4.0",
    "redis>=5.0.0",
    "jieba>=0.42.1",
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "langfuse>=2.0.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docs_seeker = ["py.typed", "core/*.yaml"]

[tool.pytest.ini_options]
# 将 src 加入 pythonpath，确保未执行 pip install -e 时 from docs_seeker.* 也能导入
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
# 起步以错误级规则为主（pyflakes/pycodestyle/import 排序），避免风格噪声淹没问题
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行宽由 formatter 负责，不强制手写

[tool.mypy]
# 实际运行环境为 CPython 3.12（本机 venv 与 Docker python:3.12-slim）；
# numpy 等依赖的 stubs 已使用 3.12 语法，mypy 解析需对齐该版本
python_version = "3.12"
files = ["src/docs_seeker"]
strict = false
ignore_missing_imports = true
exclude = ["\\.venv/"]
